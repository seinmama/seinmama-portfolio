<section class="guestbook">
  <h1>Guestbook</h1>

  <form class="guestbook__form" (submit)="$event.preventDefault(); submit()">
    <input
      class="guestbook__input"
      type="text"
      placeholder="Name"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      name="name"
    />
    <textarea
      class="guestbook__input"
      placeholder="Leave a message"
      [ngModel]="message()"
      (ngModelChange)="message.set($event)"
      name="message"
    ></textarea>
    <button type="submit" class="guestbook__submit">Sign</button>
  </form>

  <ul class="guestbook__list">
    @for (entry of guestbook.entries(); track entry.id) {
      <li class="guestbook__entry">
        <strong>{{ entry.name }}</strong>
        <p>{{ entry.message }}</p>
      </li>
    } @empty {
      <li class="guestbook__empty">No entries yet — be the first.</li>
    }
  </ul>
</section>
