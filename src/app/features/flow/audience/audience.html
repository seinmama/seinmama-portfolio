<section class="audience">
  <div class="audience__card">
    <div class="audience__titlebar">
      <span>◆ who's visiting? ◆</span>
      <span class="audience__controls">
        <span class="audience__control"></span>
        <span class="audience__control"></span>
      </span>
    </div>

    <div class="audience__body">
      <h2 class="audience__step">step 1 · who are you?</h2>
      <p class="audience__hint">the site rearranges itself &amp; offers different skins based on your pick</p>

      <div class="audience__grid">
        @for (item of audiences; track item.id) {
          <button type="button" class="audience__option" (click)="choose(item.id)">
            <span class="audience__icon">{{ item.icon }}</span>
            <span class="audience__text">
              <span class="audience__name">{{ item.name }}</span>
              <span class="audience__description">{{ item.description }}</span>
            </span>
          </button>
        }
      </div>
    </div>
  </div>
</section>
