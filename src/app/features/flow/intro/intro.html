<section class="intro" (click)="onIntroClick()">
  <button type="button" class="intro-skip" (click)="continue(); $event.stopPropagation()">skip »</button>

  <div class="intro-terminal">
    <pre class="intro-term">{{ introText() }}</pre>
    <div class="intro-line">
      <span class="intro-cursor">█</span>
    </div>

    @if (ready()) {
      <button type="button" class="intro-enter" (click)="continue(); $event.stopPropagation()">[ PRESS ENTER ]</button>
    }
  </div>
</section>
