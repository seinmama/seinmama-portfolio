<section class="intro" (click)="onIntroClick()">
  <button type="button" class="intro__skip" (click)="continue(); $event.stopPropagation()">skip »</button>

  <div class="intro__terminal">
    <pre class="intro__term">{{ introText() }}</pre>
    <div class="intro__line">
      <span class="intro__cursor">█</span>
    </div>

    @if (ready()) {
      <button type="button" class="intro__enter" (click)="continue(); $event.stopPropagation()">[ PRESS ENTER ]</button>
    }
  </div>
</section>
