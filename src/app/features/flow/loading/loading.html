<section class="loading" [class]="theme.themeClass()">
  <button type="button" class="loading-skip" (click)="skip()">skip »</button>

  <div class="loading-stage">
    @if (theme.skin() === 'newspaper') {
      <svg class="loading-art" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g class="loading-pages">
          <rect x="118" y="38" width="70" height="50" rx="2" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1" transform="rotate(8 153 63)" />
          <rect x="100" y="48" width="70" height="50" rx="2" fill="var(--bg)" stroke="var(--text-muted)" stroke-width="1" transform="rotate(-6 135 73)" />
          <g transform="rotate(-6 135 73)">
            <line x1="112" y1="60" x2="150" y2="60" stroke="var(--text-muted)" stroke-width="2" />
            <line x1="112" y1="70" x2="160" y2="70" stroke="var(--text-muted)" stroke-width="2" />
            <line x1="112" y1="80" x2="155" y2="80" stroke="var(--text-muted)" stroke-width="2" />
          </g>
        </g>

        <rect x="30" y="70" width="140" height="80" rx="12" fill="var(--accent)" />
        <rect x="48" y="92" width="36" height="8" rx="2" fill="var(--surface)" opacity="0.6" />
        <rect x="48" y="108" width="90" height="8" rx="2" fill="var(--surface)" opacity="0.4" />

        <g class="loading-wheel" style="transform-origin: 65px 158px;">
          <circle cx="65" cy="158" r="18" fill="var(--surface)" />
          <path d="M65 158 L65 140 A18 18 0 0 1 80.6 149 Z" fill="var(--accent)" />
          <path d="M65 158 L80.6 149 A18 18 0 0 1 80.6 167 Z" fill="var(--surface)" />
          <path d="M65 158 L80.6 167 A18 18 0 0 1 65 176 Z" fill="var(--accent)" />
          <path d="M65 158 L65 176 A18 18 0 0 1 49.4 167 Z" fill="var(--surface)" />
          <path d="M65 158 L49.4 167 A18 18 0 0 1 49.4 149 Z" fill="var(--accent)" />
          <path d="M65 158 L49.4 149 A18 18 0 0 1 65 140 Z" fill="var(--surface)" />
        </g>
        <g class="loading-wheel" style="transform-origin: 135px 158px;">
          <circle cx="135" cy="158" r="18" fill="var(--surface)" />
          <path d="M135 158 L135 140 A18 18 0 0 1 150.6 149 Z" fill="var(--accent)" />
          <path d="M135 158 L150.6 149 A18 18 0 0 1 150.6 167 Z" fill="var(--surface)" />
          <path d="M135 158 L150.6 167 A18 18 0 0 1 135 176 Z" fill="var(--accent)" />
          <path d="M135 158 L135 176 A18 18 0 0 1 119.4 167 Z" fill="var(--surface)" />
          <path d="M135 158 L119.4 167 A18 18 0 0 1 119.4 149 Z" fill="var(--accent)" />
          <path d="M135 158 L119.4 149 A18 18 0 0 1 135 140 Z" fill="var(--surface)" />
        </g>
      </svg>
    } @else {
      <app-loader />
    }

    <h2 class="loading-title">{{ word() }}</h2>

    <div class="loading-bar">
      <div class="loading-bar-fill" [style.width.%]="progress()"></div>
    </div>

    <p class="loading-sub">{{ copy().sub }}</p>
  </div>
</section>
