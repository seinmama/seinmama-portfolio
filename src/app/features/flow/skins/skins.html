<section class="skins">
  <div class="skins__card-wrap">
    <div class="skins__titlebar">
      <span>◆ pick your skin ◆</span>
      <span class="skins__controls">
        <span class="skins__control"></span>
        <span class="skins__control"></span>
      </span>
    </div>

    <div class="skins__body">
      <h2 class="skins__step">step 2 · pick a look</h2>
      @if (audience(); as person) {
        <p class="skins__hint">
          {{ person.icon }} {{ person.name }} view · {{ skins().length }} skins picked for you — click to preview
        </p>
      } @else {
        <p class="skins__hint">✨ pick a look — click to preview</p>
      }

      <div class="skins__grid">
        @for (item of skins(); track item.id) {
          <button
            type="button"
            class="skins__card"
            [class.skins__card--active]="activeId() === item.id"
            [style.--gradient]="item.gradient"
            (click)="preview(item.id)"
          >
            <span class="skins__icon">{{ item.icon }}</span>
            <span class="skins__name">{{ item.name }}</span>
          </button>
        }
      </div>

      <div class="skins__actions">
        <button type="button" class="skins__back" (click)="back()">« back</button>
        <button type="button" class="skins__enter" (click)="enter()">▶ enter my homepage</button>
      </div>
    </div>
  </div>
</section>
